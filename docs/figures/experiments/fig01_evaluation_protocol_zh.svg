<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1060" width="432pt" height="254.4pt"><rect x="0" y="0" width="1800" height="1060" fill="white"/><rect x="45" y="45" width="500" height="215" rx="12" fill="#F1F4F6" stroke="#8FA1AE" stroke-width="3"/><text x="295.0" y="118.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">规范化图与证据</text><text x="295.0" y="162.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">OptimusKG + DrugBank</text><text x="295.0" y="206.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">冻结的生物学特征</text><rect x="650" y="45" width="500" height="215" rx="12" fill="#F1F4F6" stroke="#8FA1AE" stroke-width="3"/><text x="900.0" y="118.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">按药物–疾病对划分</text><text x="900.0" y="162.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">R0 重复实验，五折划分</text><text x="900.0" y="206.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">不同划分可共享药物或疾病</text><rect x="1255" y="45" width="500" height="215" rx="12" fill="#F1F4F6" stroke="#8FA1AE" stroke-width="3"/><text x="1505.0" y="118.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">各折可用输入</text><text x="1505.0" y="162.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">图：屏蔽目标关系事实</text><text x="1505.0" y="206.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">标签：仅使用训练集正例</text><rect x="45" y="400" width="500" height="225" rx="12" fill="#F1F4F6" stroke="#8FA1AE" stroke-width="3"/><text x="295.0" y="478.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">匹配条件下的比较</text><text x="295.0" y="522.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">EviHGT、HGT-D1、PairMLP-D1</text><text x="295.0" y="566.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">相同 D1，统一在 3G 处评价</text><rect x="650" y="400" width="500" height="225" rx="12" fill="#F1F4F6" stroke="#8FA1AE" stroke-width="3"/><text x="900.0" y="461.46" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="28" fill="#111111">按原生流程适配的基线</text><text x="900.0" y="501.46" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="28" fill="#111111">HGTDR-adapted（support）</text><text x="900.0" y="541.46" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="28" fill="#111111">HGTDR-adapted-contra（contra）</text><text x="900.0" y="581.46" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="28" fill="#111111">TxGNN：预训练 + 500 epochs</text><rect x="1255" y="400" width="500" height="225" rx="12" fill="#F1F4F6" stroke="#8FA1AE" stroke-width="3"/><text x="1505.0" y="478.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">频次基线</text><text x="1505.0" y="522.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">统计训练集正例中的药物频次</text><text x="1505.0" y="566.1" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">不使用疾病输入</text><rect x="45" y="770" width="760" height="210" rx="12" fill="#EAF1F7" stroke="#8FA1AE" stroke-width="3"/><text x="425.0" y="840.6" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">共同的开发集候选</text><text x="425.0" y="884.6" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">Support：适应证正例 P 与未标注 U</text><text x="425.0" y="928.6" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">Contra：禁忌证正例 P 与未标注 U</text><rect x="915" y="770" width="840" height="210" rx="12" fill="#EAF1F7" stroke="#8FA1AE" stroke-width="3"/><text x="1335.0" y="840.6" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">按疾病计算宏平均指标</text><text x="1335.0" y="884.6" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">先跨有效折汇总同一疾病，再跨疾病平均</text><text x="1335.0" y="928.6" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#111111">ROC-AUC、AP 与 Top-K 检索指标</text><line x1="545" y1="152.5" x2="638" y2="152.5" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><polygon points="650,152.5 633,144.5 633,160.5" fill="#657682"/><line x1="1150" y1="152.5" x2="1243" y2="152.5" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><polygon points="1255,152.5 1238,144.5 1238,160.5" fill="#657682"/><line x1="1505" y1="260" x2="1505" y2="330" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><line x1="295" y1="330" x2="1505" y2="330" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><line x1="295" y1="330" x2="295" y2="388" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><polygon points="295,400 287,383 303,383" fill="#657682"/><line x1="900" y1="330" x2="900" y2="388" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><polygon points="900,400 892,383 908,383" fill="#657682"/><line x1="1505" y1="330" x2="1505" y2="388" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><polygon points="1505,400 1497,383 1513,383" fill="#657682"/><line x1="295" y1="625" x2="295" y2="695" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><line x1="900" y1="625" x2="900" y2="695" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><line x1="1505" y1="625" x2="1505" y2="695" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><line x1="295" y1="695" x2="1505" y2="695" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><line x1="425" y1="695" x2="425" y2="758" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><polygon points="425,770 417,753 433,753" fill="#657682"/><line x1="805" y1="875" x2="903" y2="875" stroke="#657682" stroke-width="3.5" stroke-linecap="round"/><polygon points="915,875 898,867 898,883" fill="#657682"/><text x="900" y="1040" text-anchor="middle" font-family="Times New Roman, SimSun" font-size="30" fill="#42596A">R0 五折开发集比较</text></svg>