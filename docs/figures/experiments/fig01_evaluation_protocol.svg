   <g id="text_1">
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(13.2778 28.800463)">Canonical graph and evidence</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(24.29655 39.3139)">OptimusKG + DrugBank</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(21.513425 49.822338)">Frozen biological features</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(171.908125 28.798588)">Pair-level partitions</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(155.454375 39.3139)">Original repeat R0, five folds</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(160.561875 49.773588)">Endpoints may be shared</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(300.73095 28.800463)">Fold-specific legal inputs</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(296.286575 39.3114)">Graph: target facts masked</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(292.27845 49.773588)">Labels: training positives only</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(30.18655 103.619488)">Matched comparison</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(12.860925 114.407925)">EviHGT, HGT-D1, PairMLP-D1</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(14.7278 124.690113)">Same D1 + fixed 3G endpoint</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(161.22375 103.619488)">Adapted native baselines</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(168.795 114.179175)">HGTDR: 300 epochs</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(151.56375 124.690113)">TxGNN: pretrain + 500 epochs</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(309.6197 103.572613)">Frequency baseline</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(293.3197 114.08355)">Training-positive drug counts</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(314.7322 124.641363)">No disease input</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(36.747925 177.542038)">Common development candidates</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(21.70105 188.052975)">Support: known indication P vs unknown U</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(29.710425 199.310163)">Contra: known contraindication P vs U</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(259.11435 178.241413)">Disease-macro evaluation</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(217.08935 188.0061)">Same disease across eligible folds, then diseases</text>
    <text style="font-size: 8px; font-family: 'Arial'" transform="translate(244.814975 198.566413)">ROC-AUC, AP and Top-K retrieval</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'Arial'; text-anchor: middle; fill: #42596a" x="205.92" y="227.79792" transform="rotate(-0 205.92 227.79792)">Development comparison only · No cold-start or independent final-test claim</text>
   </g>
  </g>
 </g>
