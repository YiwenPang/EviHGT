name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU tests (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-preprocess.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Inspect the CPU environment
        run: python check_environment.py --device cpu
      - name: Run tests
        run: python -B -m pytest tests experiments/cold_start/test_locations.py experiments/cold_start/test_run_case.py -q -p no:cacheprovider --basetemp outputs/pytest
      - name: Check cold-start runtime compatibility
        run: python -B experiments/cold_start/synthetic/test_frozen_test_score.py
      - name: Run the complete primary-entry smoke workflow
        run: python -B main.py --smoke
      - name: Run portable experiment entry points
        run: |
          python -B main.py --experiment ablations --smoke
          python -B main.py --experiment losses --smoke
          python -B main.py --experiment comparisons --methods FULL TRAIN_VISIBLE_POPULARITY --smoke
          python -B main.py --experiment cold --skip-cold-hgtdr --smoke
      - name: Check public entry points
        run: |
          python main.py --help
          python main.py --experiment all --help
          python ablation.py --help
          python prepare_data.py --help
          python export_data.py --help
          python check_data.py --help
